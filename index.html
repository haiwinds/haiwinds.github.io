<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Haiwind 的个人博客，用文字记录日常，用镜头收藏世界。">
    <meta name="theme-color" content="#0b0b0b">
    <title>Haiwind の Blog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261026-1">
    <link rel="icon" type="image/png" href="/images/avatar-icon.png?v=20261026-1">
    <link rel="stylesheet" href="/ananke/css/main.min.d05fb5f317fcf33b3a52936399bdf6f47dc776516e1692e412ec7d76f4a5faa2.css">
    <link rel="stylesheet" href="/site.css?v=20261023-12">
    <script type="module" src="/assets/js/site-shell.js?v=20261026-1"></script>
    <script type="module" src="/assets/js/public-posts.js?v=20261024-1"></script>
  </head>
  <body class="home-page">
    <div class="home-shell" id="top">
      <aside class="home-sidebar">
        <div class="home-profile">
          <a class="home-avatar" href="/" aria-label="Haiwind 博客首页">
            <img data-site-avatar src="/images/gohugo-default-sample-hero-image.png" alt="">
          </a>
          <a class="home-brand" href="/">Haiwind の Blog</a>
          <p class="home-tagline">穷极一生，<br>只找到一双为我流泪的眼睛。</p>
        </div>

        <nav class="home-nav" aria-label="主导航">
          <a class="is-current" href="#top" aria-current="page">首页</a>
          <a href="/post/">文章</a>
          <a href="/gallery/">相册</a>
          <a href="/about/">关于</a>
        </nav>

        <div class="home-sidebar-footer">
          <span>© 2026 Haiwind</span>
          <a href="/admin/">管理动态</a>
        </div>
      </aside>

      <main class="home-main">
        <section class="home-hero" aria-labelledby="home-title">
          <form class="page-search" data-site-search role="search">
            <label class="visually-hidden" for="home-search-input">搜索动态</label>
            <input id="home-search-input" name="q" type="search" placeholder="搜索文章、照片…" autocomplete="off">
            <button type="submit" aria-label="搜索">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.8" cy="10.8" r="6.3"></circle>
                <path d="m15.5 15.5 4.2 4.2"></path>
              </svg>
            </button>
          </form>
          <div class="home-hero-content">
            <p class="home-eyebrow">BLOG / PHOTOS</p>
            <h1 id="home-title">记录生活与光影</h1>
            <p class="home-lead">以后会是什么样，谁知道呢。<br>还能找回曾经的自己吗</p>
            <div class="home-hero-actions">
              <a class="home-button home-button-light" href="/post/">浏览文章</a>
              <a class="home-button home-button-outline" href="/gallery/">查看相册</a>
            </div>
          </div>
          <a class="home-scroll-cue" href="#latest-updates" aria-label="向下浏览最新动态"><span></span></a>
        </section>

        <section class="home-updates" id="latest-updates" aria-labelledby="live-feed-heading">
          <div class="home-updates-heading">
            <div>
              <p class="live-feed-eyebrow">LATEST MOMENTS</p>
              <h2 id="live-feed-heading">最近的记录</h2>
            </div>
            <a class="home-all-posts" href="/post/">浏览全部动态 <span aria-hidden="true">→</span></a>
          </div>
          <p class="live-feed-status" data-live-feed-status role="status" aria-live="polite">正在加载动态…</p>
          <div class="live-feed-grid" data-live-feed></div>
        </section>
      </main>
    </div>
  </body>
</html>
