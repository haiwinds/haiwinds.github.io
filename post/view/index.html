<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Haiwind 博客动态">
    <title>博客动态 | Haiwind</title>
    <link rel="icon" type="image/png" href="/images/haiwind-favicon.png?v=20261027-1" sizes="64x64">
    <script src="/assets/js/site-theme.js?v=20261102-2"></script>
    <link rel="stylesheet" href="/site.css?v=20261103-1">
    <link rel="stylesheet" href="/admin/admin.css">
    <script type="module" src="/assets/js/post-detail.js?v=20261102-4"></script>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <a class="admin-brand" href="/">Haiwind <span>博客动态</span></a>
      <nav class="post-detail-nav" aria-label="页面导航">
        <button class="theme-toggle theme-toggle-page" data-theme-toggle type="button" aria-label="切换到夜间模式" aria-pressed="false">
          <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="theme-icon-sun" cx="12" cy="12" r="4"></circle>
            <path class="theme-icon-sun" d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            <path class="theme-icon-moon" d="M20.2 15.6A8.5 8.5 0 0 1 8.4 3.8 8.5 8.5 0 1 0 20.2 15.6Z"></path>
          </svg>
        </button>
        <a class="admin-back-link" href="/post/">返回动态列表</a>
        <a class="post-detail-admin-link" href="/admin/">管理博客</a>
      </nav>
    </header>
    <main class="post-detail-main">
      <a class="post-detail-back" href="/post/">← 返回动态列表</a>
      <p class="admin-message" data-post-status role="status" aria-live="polite">正在加载动态…</p>
      <article class="post-detail-card" data-post-content hidden>
        <time class="live-post-date" data-post-date></time>
        <h1 data-post-title></h1>
        <div class="post-detail-body" data-post-body></div>
        <div class="post-detail-gallery" data-post-images></div>
      </article>
    </main>
  </body>
</html>
